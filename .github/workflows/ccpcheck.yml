# GitHub Action to run cppcheck
# 
name: cppcheck

on: [push, pull_request]

jobs:
  cppcheck:
    runs-on: ubuntu-slim
    name: cppcheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # cppcheck is not part of the ubuntu-slim image
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --std=c++17 ./include/*.hh
          cppcheck --std=c++17 ./src/*.cc
