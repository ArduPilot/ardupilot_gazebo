# GitHub Action to run cpplint
#
# The cpplint configuration file is:
#
#   ./CPPLINT.cfg
#
name: ccplint

on: [push, pull_request]

jobs:
  cpplint:
    runs-on: ubuntu-slim
    name: cpplint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # ubuntu-slim provides python and pipx
      - name: Run cpplint
        run: |
          pipx run cpplint ./include/*.hh
          pipx run cpplint ./src/*.cc
