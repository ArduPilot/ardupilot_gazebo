# pre-commit hooks, see https://pre-commit.com
#
#   pipx install pre-commit   # or: pip install pre-commit
#   pre-commit install        # run on every commit
#   pre-commit run --all-files
#
# cppcheck and check-sdf use the system cppcheck and gz, skip them with
# SKIP=cppcheck,check-sdf when they are not installed.
exclude: ^models/.*/meshes/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-xml
        files: \.(sdf|config|xml)$
        types: [file]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        language: system
        entry: cppcheck --std=c++17 --error-exitcode=1 --quiet -DGZ_ADD_PLUGIN(...)=
        files: \.(hh|cc)$
      - id: check-sdf
        name: check-sdf
        language: system
        entry: scripts/check_sdf.sh
        files: \.sdf$
